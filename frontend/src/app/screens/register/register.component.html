<form [formGroup]="form" (ngSubmit)="submit()" class="form">
  <h2>Registracija</h2>

  <select formControlName="accountType">
    <option value="user">Korisnik</option>
    <option value="owner">Vlasnik salona</option>
  </select>

  <input formControlName="email" placeholder="Email" />
  <input formControlName="password" type="password" placeholder="Lozinka (min 6 znakova)" />

  @if (isOwner) {
    <input formControlName="firstName" placeholder="Ime" />
    <input formControlName="lastName" placeholder="Prezime" />
    <input formControlName="instagram" placeholder="Instagram (opciono)" />
  }

  @if (error$ | async; as error) {
    <p class="error">{{ error }}</p>
  }

  <button type="submit" class="btn" [disabled]="!canSubmit">Registruj se</button>

  <p class="muted">Već imaš nalog? <a routerLink="/login">Prijavi se</a></p>
</form>
