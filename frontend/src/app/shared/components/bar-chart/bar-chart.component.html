<div class="chart">
  <span class="max">{{ max | number: '1.0-0' }} {{ unit }}</span>

  <div class="bars">
    @for (bar of bars; track $index) {
      <div class="bar-wrap" [title]="bar.label + ': ' + (bar.value | number: '1.0-0') + ' ' + unit">
        <div class="bar" [style.height.%]="bar.percent"></div>
      </div>
    }
  </div>

  <div class="labels">
    @for (bar of bars; track $index) {
      <span class="label">{{ bar.showLabel ? bar.label : '' }}</span>
    }
  </div>
</div>
