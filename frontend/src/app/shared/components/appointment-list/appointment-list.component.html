@for (appointment of appointments; track appointment.id) {
  <div class="row">
    <div>
      <strong>{{ appointment.salonName || 'Salon' }}</strong>
      <div class="muted">
        {{ appointment.appointmentDate | date: 'dd.MM.yyyy' }} u {{ appointment.timeSlot }}
      </div>
    </div>

    @if (canCancel) {
      <button type="button" class="btn btn-danger" (click)="cancelAppointment.emit(appointment.id)">Otkaži</button>
    }
  </div>
} @empty {
  <p class="muted">Nema termina.</p>
}
