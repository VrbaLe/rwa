<nav class="navbar">
  <a routerLink="/" class="brand">TrimTime</a>

  <div class="account">
    <!-- <button type="button" class="icon-btn" (click)="toggle()" aria-label="Korisnički meni">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
      </svg>
    </button> -->
    
    <button type="button" class="icon-btn" (click)="toggle()" aria-label="Korisnički meni">
      @if (userData$ | async; as userData) {
        @if (userData.owner?.picture) {
          <img [src]="userData.owner?.picture" alt="Profilna slika" class="profile-image" />
        } @else {
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" 
            stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
          </svg>
        }
      } @else {
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" >
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
        </svg>
      }
    </button>


    @if (open) {
      <div class="menu">
        @if (user$ | async; as user) {
          <div class="menu-header">{{ user.email || 'Moj nalog' }}</div>
          <a routerLink="/profile" (click)="close()">Moj profil</a>
          @if (isOwner$ | async) {
            <a routerLink="/salons/new" (click)="close()">Dodaj salon</a>
          }
          <button type="button" (click)="logoutUser()">Odjava</button>
        } @else {
          <a routerLink="/login" (click)="close()">Prijava</a>
          <a routerLink="/register" (click)="close()">Registracija</a>
        }
      </div>
    }
  </div>
</nav>
