<form [formGroup]="form" (ngSubmit)="submit()" class="treatment-form">
  <input formControlName="name" placeholder="Naziv usluge (npr. Šišanje)" />
  <input type="number" formControlName="price" placeholder="Cena (RSD)" />
  <input type="number" formControlName="duration" placeholder="Trajanje (min)" />
  <button type="submit" class="btn" [disabled]="form.invalid">Dodaj uslugu</button>
</form>
